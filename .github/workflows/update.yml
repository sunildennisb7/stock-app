name: Daily update

on:
  schedule:
    - cron: "45 7 * * 1-5"    # 1:15 PM IST: today's buy list from live prices (+ push at ~1:30 PM)
    - cron: "15 13 * * 1-5"   # 6:45 PM IST, Monday-Friday (after NSE publishes end-of-day files)
    - cron: "0 16 * * 1-5"    # 9:30 PM IST, second run in case Yahoo's data arrived late
  workflow_dispatch:           # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: |
            cache/prices.pkl
            cache/fundamentals.json
            cache/fund_navs.pkl
            cache/amfi_navall.txt
            cache/alert_state.json
          key: data-${{ github.run_id }}
          restore-keys: data-
      - run: pip install -r requirements.txt
      - name: Analyse market
        env:
          TZ: Asia/Kolkata
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIBERS: ${{ secrets.PUSH_SUBSCRIBERS }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "45 7 * * 1-5" ]; then
            python run.py --refresh --no-open --midday
          elif [ -n "$SCHEDULE" ]; then
            python run.py --refresh --no-open --notify
          else
            python run.py --refresh --no-open
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
